schema: spec-driven

context: |
  VOID_AI (a.k.a. Nova) — a voice-first AI companion + map/agent app.
  - App: Rust + Slint (kaira-slint), iOS (winit + Skia/Metal) and Android
    (android-activity); built via cargo / cargo-apk / xcodebuild.
  - Voice agent "Nova": Pipecat realtime cascade over WebRTC (pipecat-agent),
    Soniox STT/TTS + LLM; on-device TTS (Piper/Supertonic via sherpa-onnx) also
    available for offline speech.
  - Map: interactive Mapbox GL JS in a WKWebView positioned over the Slint "map"
    view (src/ios_map.rs), driven by Nova's `map` UI-control op; route polyline via
    the Mapbox Directions API. Native web/map embedding on iOS uses WKWebView
    (Servo works on desktop, not iOS).
  Conventions: idiomatic Rust matching surrounding code; objc2 for iOS FFI; keep
  dependencies cross-compile-friendly (android + ios).

