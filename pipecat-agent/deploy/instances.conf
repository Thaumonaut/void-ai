# VOID_AI bot instances — the single source of truth for deploy + TLS.
#
# Read by do-setup.sh (what to run) and tls-setup.sh (what to expose over HTTPS),
# so the droplet cannot drift from the docs the way it did when each container's
# mode lived only in a hand-typed `docker run` line.
#
# The name is the axis you are testing on, not the persona: it becomes both the
# container suffix (voidai-bot-<name>) and the hostname (<name>.<ip>.sslip.io),
# so cascade and gemini sit side by side at predictable URLs.
#
# name     port  persona  mode
cascade    8080  nova     cascade
gemini     8081  kaira    gemini
vesper     8082  vesper   gemini
