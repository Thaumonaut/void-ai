# Android: the prebuilt libonnxruntime.so references libc symbols the linker
# rejects under --no-allow-shlib-undefined; they resolve on-device.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,--allow-shlib-undefined"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,--allow-shlib-undefined"]
